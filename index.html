<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PO Mastery Academy - Enterprise Product Owner Learning & 30-Mock Exam Certification Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a'
              }
            }
          }
        }
      }
    </script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Prose Container Styles for Deep Educational Content */
      .prose-container {
        color: #334155;
        line-height: 1.75;
        font-size: 0.95rem;
      }
      .prose-container p {
        margin-bottom: 1.15rem;
      }
      .prose-container h1, .prose-container h2, .prose-container h3, .prose-container h4 {
        color: #0f172a;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-top: 1.75rem;
        margin-bottom: 0.85rem;
      }
      .prose-container h2 {
        font-size: 1.45rem;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0.4rem;
      }
      .prose-container h3 {
        font-size: 1.2rem;
      }
      .prose-container h4 {
        font-size: 1.05rem;
      }
      .prose-container strong {
        color: #0f172a;
        font-weight: 700;
      }
      .prose-container ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 1.25rem;
      }
      .prose-container ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-bottom: 1.25rem;
      }
      .prose-container li {
        margin-bottom: 0.4rem;
      }
      .prose-container blockquote {
        border-left: 4px solid #3b82f6;
        padding: 0.75rem 1.25rem;
        background-color: #eff6ff;
        border-radius: 0 0.75rem 0.75rem 0;
        margin-bottom: 1.25rem;
        color: #1e3a8a;
        font-style: italic;
      }
      .prose-container code {
        background-color: #f1f5f9;
        color: #2563eb;
        padding: 0.2rem 0.4rem;
        border-radius: 0.375rem;
        font-size: 0.875em;
        font-weight: 600;
      }
      .prose-container pre {
        background-color: #0f172a;
        color: #f8fafc;
        padding: 1.25rem;
        border-radius: 0.75rem;
        overflow-x: auto;
        margin-bottom: 1.5rem;
        border: 1px solid #1e293b;
      }
      .prose-container pre code {
        background-color: transparent;
        color: inherit;
        padding: 0;
        font-weight: 400;
      }

      /* Beautiful Responsive Tables */
      .prose-container table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1.25rem;
        margin-bottom: 1.75rem;
        font-size: 0.875rem;
        border-radius: 0.75rem;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
      .prose-container th {
        background-color: #1e293b;
        color: #ffffff;
        font-weight: 700;
        text-align: left;
        padding: 0.85rem 1rem;
        border: 1px solid #334155;
      }
      .prose-container td {
        padding: 0.75rem 1rem;
        border: 1px solid #e2e8f0;
        vertical-align: top;
      }
      .prose-container tr:nth-child(even) {
        background-color: #f8fafc;
      }
      .prose-container tr:hover {
        background-color: #f1f5f9;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
